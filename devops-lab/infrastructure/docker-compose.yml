x-dns-config: &default-dns
  dns:
    - 8.8.8.8
    - 1.1.1.1

networks:
  ci-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

services:
  # ==========================================
  # 1. Database (SonarQube için PostgreSQL)
  # ==========================================
  sonardb:
    image: postgres:15-alpine
    container_name: sonardb
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_secret_password
      POSTGRES_DB: sonar
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - db-network

  # ==========================================
  # 2. SonarQube (Statik Kod Analiz Sunucusu)
  # ==========================================
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - sonardb
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_secret_password
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
    volumes:
      - ./sonarqube_data:/opt/sonarqube/data
      - ./sonarqube_extensions:/opt/sonarqube/extensions
      - ./sonarqube_logs:/opt/sonarqube/logs
    networks:
      - ci-network
      - db-network

  # ==========================================
  # 3. Jenkins (CI Automation Server)
  # ==========================================
  jenkins:
    <<: *default-dns
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - DOCKER_TLS_CERTDIR=
      - JAVA_OPTS=-Xmx2g -Xms512m
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    networks:
      - ci-network

  # ==========================================
  # 4. Nexus Repository Manager (Artifact Storage)
  # ==========================================
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./nexus_data:/nexus-data
    networks:
      - ci-network